name: chat-template-env
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pytest
  - pyaml
  - awscli
  - boto3
  - plotly
  - kaleido-core
  - go-yq
  - pip:
    # Required for local AWS SSO/Identity Center profiles used by boto3/botocore.
    # Without the CRT extra, botocore can fail while signing RDS Data API calls.
    - botocore[crt]
    - -r src/rag_lambda/requirements.txt
    - -r evals/requirements.txt
# Note: PYTHONPATH is automatically set to the project root via an activation script
# created by scripts/setup/setup_local_dev_env.sh when the environment is created/updated
