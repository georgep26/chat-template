# Application Configuration
# This file contains configuration settings for the application, including logging configuration

rag_chat:
  rewrite: # Query rewrite settings
    model: # Model to use for rewriting queries
      id: "amazon.nova-micro-v1:0"
      temperature: 0.0 # Temperature for the rewrite model
      region: "us-east-1" # Region for the rewrite model
  clarify: # Query clarification settings
    model: # Model to use for clarification
      id: "amazon.nova-micro-v1:0"
      temperature: 0.0 # Temperature for the clarify model
      region: "us-east-1" # Region for the clarify model
  split: # Query splitting settings
    model: # Model to use for splitting queries
      id: "amazon.nova-micro-v1:0"
      temperature: 0.0 # Temperature for the split model
      region: "us-east-1" # Region for the split model
  retrieval: # Retrieval settings for the knowledge base
    region: "us-east-1" # Region for the retrieval model (defaults to the region of the database)
    knowledge_base_id: "${KNOWLEDGE_BASE_ID}" # Knowledge base ID to use for retrieval
    number_of_results: 10 # Number of results to retrieve from the knowledge base
  generation: # Generation settings for the answer
    model: # Model to use for generation
      id: "amazon.nova-micro-v1:0"
      temperature: 0.0 # Temperature for the generation model
      region: "us-east-1" # Region for the generation model (defaults to the region of the database)
  chat_history_store: # History of the conversation settings
    memory_backend_type: "aurora_data_api"  # Options: postgres, aurora_data_api, dynamo, vector, local_sqlite
    # Configuration for "postgres" backend (requires VPC):
    # db_connection_secret_name: "chat-template-db-connection-dev"  # Secret name for the database connection
    # table_name: "chat_history"  # Postgres table name for chat history
    # Configuration for "aurora_data_api" backend (no VPC required):
    db_cluster_arn: "${DB_CLUSTER_ARN}"
    db_credentials_secret_arn: "${DB_CREDENTIALS_SECRET_ARN}"
    database_name: "chat_template_db"
    table_name: "chat_history"
    region: "us-east-1"  # Optional, defaults to retrieval.region
  summarization: # Summarization settings for when the conversation is too long
    summarization_threshold: 20  # Number of messages before summarization
    model: # Model to use for summarization
      id: "amazon.nova-micro-v1:0"
      temperature: 0.0 # Temperature for the summarization model
      region: "us-east-1" # Region for the summarization model (defaults to the region of the database)

ingestion:
  document_bucket_name: "${DOCUMENT_BUCKET_NAME}"
  landing_prefix: "kb_landing/"
  raw_prefix: "kb_raw/"
  index_prefix: "kb_index/"
  artifacts_prefix: "kb_artifacts/"
  catalog_prefix: "kb_catalog/${ENVIRONMENT}/"
  default_tenant_id: "${DEFAULT_TENANT_ID}"
  default_collection_id: "default"
  default_access_tier: "restricted" # Default for uploaded documents; relax per environment only for explicit testing.
  debug_artifacts_enabled: false # When true, write model-debug JSON under kb_raw/{document_id}/debug/.
  debug_include_model_payloads: false # When true, include raw model responses and Sonnet request JSON in debug artifacts.
  metadata_schema_version: "1.0"
  pdf_text_probe_pages: 5 # Number of initial PDF pages to inspect for embedded text.
  pdf_text_available_min_chars: 100 # Minimum extracted chars before embedded PDF text is considered usable; below this, mark OCR as required.
  pdf_always_ocr: false # Force OCR for PDFs even when embedded text appears usable.
  pdf_front_page_sample_count: 30 # Number of front-matter pages to sample for hierarchy/OCR triage; IRC-style documents can have long TOCs.
  pdf_random_page_sample_count: 5 # Number of additional random pages to sample for hierarchy/OCR triage in later ingestion phases.
  pdf_default_chunk_tokens: 1000 # Target token count for fallback PDF chunks when no reliable document hierarchy is found.
  pdf_default_chunk_overlap: 0.2 # Fractional overlap for fallback chunks; section-based chunks should avoid overlap when possible.
  pdf_embedding_chunk_token_limit_titan_v2: 8192 # Max token budget for chunks embedded with amazon.titan-embed-text-v2.
  pdf_embedding_chunk_char_limit_titan_v2: 10000 # Conservative max body characters per embedding artifact to stay below Titan token and Bedrock input-size limits.
  # ---- Phase 1: multimodal triage (Nova Lite) ----
  pdf_triage_enabled: true # Run a multimodal LLM scan over sampled pages to decide OCR-need and section structure.
  pdf_triage_model_id: "amazon.nova-lite-v1:0" # Bedrock foundation model used for triage Converse calls.
  pdf_triage_region: "us-east-1" # Bedrock region; defaults to retrieval region when unset.
  pdf_triage_ocr_threshold: 0.30 # Fraction of sampled pages reporting low-quality text that triggers OCR fallback.
  pdf_triage_hierarchy_threshold: 0.50 # Fraction of sampled pages sharing the same heading pattern that triggers section chunking.
  pdf_triage_temperature: 0.0 # Decoding temperature for the per-page triage call.
  pdf_triage_max_tokens_per_page: 2048 # Max output tokens for one multimodal page-observation response.
  pdf_triage_render_scale: 2.0 # PDF render scale for multimodal page images.
  pdf_full_page_triage_enabled: false # If true, run triage on every page and ignore front/random sample counts.
  pdf_triage_text_mismatch_threshold: 0.50 # Per-page mismatch threshold between embedded text and model-visible text.
  pdf_triage_document_text_mismatch_threshold: 0.30 # Fraction of suspicious triaged pages that recommends OCR/Textract.
  pdf_text_quality_min_visible_chars: 100 # Minimum model-visible chars before comparing visible text to embedded text.
  # ---- Phase 2: section-aware chunking ----
  pdf_section_chunking_enabled: true # When triage detects hierarchy, emit one chunk per section instead of one per page.
  pdf_section_min_confidence: 0.70 # Minimum hierarchy_confidence from triage required to attempt section chunking.
  pdf_section_min_boundaries: 5 # Minimum number of detected headings required to commit to section chunking; below this, fall back to page chunks.
  pdf_section_min_chars: 40 # Drop "sections" smaller than this many characters as regex false positives.
  # ---- Phase 2b: hierarchy generation and adaptive chunking ----
  pdf_hierarchy_enabled: true # Build document_hierarchy.json when deterministic headings are available.
  hierarchy_generation_mode: "deterministic" # The backend deterministic builder is the default hierarchy candidate.
  hierarchy_review_model_mode: "never" # Options: auto, always, never. If enabled and valid, Sonnet-corrected hierarchy is authoritative.
  hierarchy_review_model_id: "us.anthropic.claude-sonnet-4-6"
  hierarchy_review_region: "us-east-1"
  hierarchy_review_min_confidence: 0.80
  hierarchy_review_temperature: 0.0
  hierarchy_review_max_tokens: 8192
  pdf_hierarchy_chunking_enabled: true # Use hierarchy nodes to create retrieval chunks when a hierarchy exists.
  pdf_hierarchy_target_min_tokens: 300
  pdf_hierarchy_target_max_tokens: 3000
  pdf_hierarchy_hard_max_tokens: 7000
  pdf_hierarchy_merge_small_leaf_nodes: true
  pdf_hierarchy_split_large_nodes_by_children: true
  pdf_hierarchy_store_index: true
  pdf_hierarchy_inline_index_max_nodes: 40
  # ---- Phase 3: Textract table extraction ----
  pdf_table_extraction_enabled: true # Run Textract over the full PDF and emit one chunk per detected table.
  pdf_table_summary_model_id: "amazon.nova-lite-v1:0" # Bedrock model used to summarize each extracted table for retrieval.
  pdf_textract_poll_interval_seconds: 5 # Wait between Textract job-status polls.
  pdf_textract_max_wait_seconds: 540 # Hard ceiling on Textract polling within a single Lambda invocation.
  pdf_max_table_extractions: 500 # Hard cap on tables per document to bound cost and Lambda runtime.
  # ---- Phase 4: Figure extraction ----
  pdf_figure_extraction_enabled: true # Use Textract LAYOUT_FIGURE blocks + Nova Lite multimodal to emit one chunk per figure.
  pdf_figure_summary_model_id: "amazon.nova-lite-v1:0" # Bedrock model used to describe each figure for retrieval.
  pdf_max_figure_extractions: 200 # Hard cap on figures per document.
  # ---- Phase 5: OCR fallback via Textract ----
  pdf_ocr_enabled: true # When deterministic text-quality checks recommend OCR, run Textract DetectDocumentText in place of pypdf text extraction.
  pdf_ocr_poll_interval_seconds: 5 # Wait between OCR-job status polls.
  pdf_ocr_max_wait_seconds: 540 # Hard ceiling on OCR polling within a single Lambda invocation.

api:
  host: "0.0.0.0"
  port: 8000
  timeout: 30

# Logging Configuration
logging:
  version: 1
  disable_existing_loggers: false
  
  formatters:
    standard:
      format: '%(asctime)s [%(levelname)s] %(name)s: %(message)s'
    detailed:
      format: '%(asctime)s [%(levelname)s] %(name)s:%(lineno)d: %(message)s'
  
  handlers:
    console:
      class: logging.StreamHandler
      level: INFO
      formatter: standard
      stream: ext://sys.stdout
    
    file:
      class: logging.handlers.RotatingFileHandler
      level: DEBUG
      formatter: detailed
      filename: logs/app.log
      maxBytes: 10485760  # 10MB
      backupCount: 5
  
  root:
    level: INFO
    handlers: [console, file]
  
  loggers:
    app:
      level: DEBUG
      handlers: [console, file]
      propagate: false

# Environment-specific overrides
environments:
  development:
    debug: true
    log_level: "DEBUG"
  
  production:
    debug: false
    log_level: "WARNING"
