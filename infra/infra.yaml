# Infrastructure Configuration
# This file defines all infrastructure resources, environments, and deployment settings
# for the chat-template project.
#
# Resources are deployed in the order they are defined in this file.
# Teardown occurs in reverse order.

project:
  name: chat-template
  default_region: us-east-1

secrets:
  accounts_file: infra/secrets/adte_sandbox/accounts.secrets.yaml

# Setup profiles are used by setup scripts. The default profile creates the
# production-style AWS Organizations workflow: dev, staging, and prod in
# separate member accounts with GitHub CI/CD access.
setup_profiles:
  default_standard_accounts:
    enabled: true
    type: aws_organizations
    environments:
      - dev
      - staging
      - prod
    create_accounts: true
    configure_github: true
    configure_oidc: true
    configure_deployer_roles: true
    configure_evals_roles: true
    configure_budgets: true

# For GitHub repository setup
github:
  github_repo: "${REPO}"
  solo_mode: true
  # Branch protection: main and development. Read by scripts/setup/setup_github.sh.
  # For main, required_approving_review_count is derived from solo_mode (0 if solo, 1 otherwise).
  branch_protection:
    main:
      required_status_checks:
        strict: true
        contexts:
          - "Run Tests"
      enforce_admins: true
      required_pull_request_reviews:
        dismiss_stale_reviews: true
        require_code_owner_reviews: false
      restrictions: null
      allow_force_pushes: false
      allow_deletions: false
      block_creations: false
      required_conversation_resolution: true
      lock_branch: false
      allow_fork_syncing: false
    development:
      # No required checks: use contexts only (omit checks - API rejects both contexts and checks).
      required_status_checks:
        strict: true
        contexts: []
      enforce_admins: true
      required_pull_request_reviews:
        required_approving_review_count: 0
        dismiss_stale_reviews: false
        require_code_owner_reviews: false
      restrictions: null
      allow_force_pushes: true
      allow_deletions: false
      block_creations: false
      required_conversation_resolution: false
      lock_branch: false
      allow_fork_syncing: false
# Logical accounts. Real account IDs, names, and local AWS profiles live in
# infra/secrets/accounts.secrets.yaml and are referenced through secret_ref.
accounts:
  management:
    kind: management
    secret_ref: management
    allow_workload_deployments: true
  dev:
    kind: organizations_member
    secret_ref: dev
    created_by_setup_profile: default_standard_accounts
  staging:
    kind: organizations_member
    secret_ref: staging
    created_by_setup_profile: default_standard_accounts
  prod:
    kind: organizations_member
    secret_ref: prod
    created_by_setup_profile: default_standard_accounts

# Environment configurations. These define deployable environments, not
# necessarily GitHub CI/CD environments. Account-specific values remain in
# uncommitted secret files.
environments:
  dev:
    account: dev
    region: us-east-1
    secrets_file: infra/secrets/adte_sandbox/dev.secrets.yaml
    ci_cd:
      enabled: true
      github_environment: dev
      deployer_role: deployer
      evals_role: evals
  staging:
    account: staging
    region: us-east-1
    secrets_file: infra/secrets/adte_sandbox/staging.secrets.yaml
    ci_cd:
      enabled: true
      github_environment: staging
      deployer_role: deployer
      evals_role: evals
      promotion_source: dev
  prod:
    account: prod
    region: us-east-1
    secrets_file: infra/secrets/adte_sandbox/prod.secrets.yaml
    ci_cd:
      enabled: true
      github_environment: production
      deployer_role: deployer
      evals_role: evals
      promotion_source: staging
      promotion_mode: copy_image_digest
  sandbox:
    account: management
    region: us-east-1
    secrets_file: infra/secrets/adte_sandbox/sandbox.secrets.yaml
    ci_cd:
      enabled: false

# Deployment sets define which enabled resources a deployment run should touch.
# Resource order still comes from the resources section below.
deployment_sets:
  full:
    description: "Deploy all enabled resources for full environment setup or rebuilds."
    resources: all
    deploy_cost_control: true
    deploy_config: true
  app:
    description: "Deploy application-layer resources without touching network, database, or knowledge base infrastructure."
    resources:
      - rag_lambda_ecr
      - history_api_lambda_ecr
      - document_ingestion_lambda_ecr
      - cognito
      - frontend
      - rag_lambda
      - history_api_lambda
      - document_ingestion_lambda
    deploy_cost_control: true
    deploy_config: true
  pr:
    description: "Deploy the minimum runtime changes needed before PR evaluations."
    resources:
      - rag_lambda_ecr
      - history_api_lambda_ecr
      - rag_lambda
      - history_api_lambda
    deploy_cost_control: false
    deploy_config: true
# Cost allocation tags for AWS billing
cost_tags:
  # Tags that will be activated for cost allocation
  allocation_tags:
    - Project
    - Environment
    - Owner
    - CostCenter
  # Default values for cost tags
  defaults:
    ManagedBy: cloudformation
budgets:
  budget_email: "${BUDGET_EMAIL}"
  dev_max_budget: 20
  staging_max_budget: 20
  prod_max_budget: 20
# Hybrid cost control: AWS-native billing + near-realtime usage guardrails.
# v1 uses scheduled polling (Option 1); v1.2 can add app-metered events (Option 3).
cost_control:
  enabled: false
  mode: enforce # observe | enforce
  stack_name: "{project}-cost-guard-{env}"
  budget:
    period: monthly
    amount_usd: 3.5
    warning_percent: 80
    hard_percent: 100
  monitor:
    interval_minutes: 5
    consecutive_breach_count: 2
    cooldown_minutes: 30
  notifications:
    warning_email: "${BUDGET_EMAIL}"
    warning_sms: ""
    critical_email: "${BUDGET_EMAIL}"
    critical_sms: ""
  pricing:
    refresh_hour_utc: 4
    safety_markup_percent: 10
  bedrock:
    enforce_model_allowlist: true
    allowed_model_ids:
      - "amazon.titan-embed-text-v2:0"
    blocked_model_ids: []
    default_invocation_cost_usd: 0.02
    model_invocation_cost_usd: {}
  reports:
    output_dir: "docs/cost_reports"
    formats:
      - json
      - html
      - png
    retention_days: 90
  resources:
    - id: "rag_lambda"
      type: "lambda"
      identifier: "{project}-{env}-rag-chat"
      enforcement: "lambda_reserved_concurrency_zero"
      disable_event_sources: true
      enabled: true
      priority: 10
    - id: "rag_runtime_role"
      type: "iam_role"
      identifier: "{project}-{env}-lambda-execution-role"
      enforcement: "attach_bedrock_deny_policy"
      enabled: true
      priority: 20
    - id: "chat_db"
      type: "aurora_cluster"
      identifier: "{project}-light-db-cluster-{env}"
      enforcement: "aurora_stop_cluster"
      enabled: true
      priority: 15
    - id: "cost_guard_monitor_lambda"
      type: "lambda"
      identifier: "{project}-{env}-cost-guard-monitor"
      enforcement: "none"
      disable_event_sources: false
      enabled: true
      priority: 500
    - id: "cost_guard_enforcer_lambda"
      type: "lambda"
      identifier: "{project}-{env}-cost-guard-enforcer"
      enforcement: "none"
      disable_event_sources: false
      enabled: true
      priority: 501
    - id: "cost_guard_pricing_sync_lambda"
      type: "lambda"
      identifier: "{project}-{env}-cost-guard-pricing-sync"
      enforcement: "none"
      disable_event_sources: false
      enabled: true
      priority: 502
    - id: "cost_guard_state_table"
      type: "dynamodb_table"
      identifier: "{project}-cost-guard-{env}"
      enforcement: "none"
      enabled: true
      priority: 510
    - id: "cost_guard_warning_topic"
      type: "sns_topic"
      identifier: "{project}-{env}-cost-guard-warning"
      enforcement: "none"
      enabled: true
      priority: 511
    - id: "cost_guard_critical_topic"
      type: "sns_topic"
      identifier: "{project}-{env}-cost-guard-critical"
      enforcement: "none"
      enabled: true
      priority: 512
    - id: "cost_guard_monitor_log_group"
      type: "cloudwatch_log_group"
      identifier: "/aws/lambda/{project}-{env}-cost-guard-monitor"
      enforcement: "none"
      enabled: true
      priority: 520
    - id: "cost_guard_enforcer_log_group"
      type: "cloudwatch_log_group"
      identifier: "/aws/lambda/{project}-{env}-cost-guard-enforcer"
      enforcement: "none"
      enabled: true
      priority: 521
    - id: "cost_guard_pricing_sync_log_group"
      type: "cloudwatch_log_group"
      identifier: "/aws/lambda/{project}-{env}-cost-guard-pricing-sync"
      enforcement: "none"
      enabled: true
      priority: 522
    - id: "cost_guard_cloudwatch_metric_api"
      type: "cloudwatch_control"
      identifier: "cloudwatch:GetMetricData"
      enforcement: "none"
      enabled: true
      priority: 530
# Required and optional tags for all resources
tags:
  required:
    - Name
    - Project
    - Environment
  optional:
    - Owner
    - CostCenter
    - ManagedBy
# =============================================================================
# IAM Roles and Policies (deployed first, before resources)
# =============================================================================
roles:
  # OIDC provider for GitHub Actions (created once per account)
  oidc_provider:
    enabled: true
    description: "GitHub OIDC identity provider for Actions authentication"
  # Deployer role for CI/CD
  deployer:
    enabled: true
    template: roles/deployer_role.yaml
    stack_name: "{project}-deployer-role-{env}"
    description: "GitHub Actions deployer role for CI/CD"
  # Evals role for running evaluations
  evals:
    enabled: true
    template: roles/evals_github_action_role.yaml
    stack_name: "{project}-evals-role-{env}"
    description: "GitHub Actions role for running evaluations"
    policies:
      - policies/evals_bedrock_policy.yaml
      - policies/evals_lambda_policy.yaml
      - policies/evals_s3_policy.yaml
      - policies/evals_secrets_manager_policy.yaml
  # CLI role for local development
  cli:
    enabled: true
    template: roles/admin_cli_role.yaml
    stack_name: "{project}-cli-role-{env}"
    description: "CLI access role for local development"
  # RAG Lambda execution role
  rag_lambda_execution:
    enabled: true
    template: roles/rag_lambda_execution_role.yaml
    stack_name: "{project}-rag-lambda-execution-role-{env}"
    description: "Execution role for RAG Lambda function"
    policies:
      - policies/rag_lambda_policy.yaml
  # Management account: policy allowing IAM principals to assume OrganizationAccountAccessRole in member accounts
  assume_org_access_policy:
    enabled: true
    template: policies/assume_org_access_role_policy.yaml
    stack_name: "{project}-assume-org-access-policy"
    description: "Policy allowing management account to assume OrganizationAccountAccessRole in dev/staging/prod (deployed in management account only)"
  # Management account: IAM user that can assume member-account admin roles (depends on assume_org_access_policy)
  management_admin_user:
    enabled: true
    template: roles/management_account_admin_user.yaml
    stack_name: "{project}-management-admin-user"
    description: "IAM user in management account that can assume OrganizationAccountAccessRole in dev, staging, prod (deployed in management account only)"
# =============================================================================
# Resources (deployed in order defined below)
# =============================================================================
resources:
  # VPC and networking
  network:
    enabled: true
    ownership: imported
    # When true, deploy_network.sh does not create a CloudFormation stack. Instead it:
    #   1. Uses environments.<env>.vpc_id if set
    #   2. Otherwise discovers the default VPC in the account
    #   3. If no default VPC, uses the first available VPC
    #   4. Writes the discovered vpc_id and subnet_ids to infra/secrets/<env>.secrets.yaml
    use_defaults: true
    # Below are only used when use_defaults is false (custom network stack).
    # template: resources/vpc_template.yaml
    # stack_name: "{project}-vpc-{env}"
    # Below config is only used when use_defaults is false (custom network stack).
    # config:
    # vpc_cidr: "10.0.0.0/16"
    # enable_nat_gateway: false
  # S3 bucket for knowledge base documents
  s3_bucket:
    enabled: true
    ownership: owned
    template: resources/s3_bucket_template.yaml
    stack_name: "{project}-s3-{env}"
    config:
      bucket_name: "{project}-{env}-s3-{global_suffix}"
      enable_versioning: true
      enable_lifecycle: true
  # Aurora Serverless database
  chat_db:
    enabled: true
    ownership: owned
    templates:
      main: resources/light_db_template.yaml
      secret: resources/db_secret_template.yaml
    stack_name: "{project}-chat-db-{env}"
    secret_stack_name: "{project}-chat-db-secret-{env}"
    config:
      min_acu: 0
      max_acu: 1
      engine_version: "15.13"
      master_username: postgres
  # Bedrock Knowledge Base
  rag_knowledge_base:
    enabled: true
    ownership: owned
    template: resources/knowledge_base_template.yaml
    stack_name: "{project}-rag-kb-{env}"
    config:
      db_stack_name: "{project}-chat-db-{env}"
      embedding_model_id: "amazon.titan-embed-text-v2:0"
      table_name: "bedrock_integration.bedrock_kb"
      s3_bucket_name: "{project}-{env}-s3-{global_suffix}"
      s3_inclusion_prefix: "kb_sources/"
  # ECR repository for RAG Lambda (lifecycle policy keeps only the 5 most recent images)
  rag_lambda_ecr:
    enabled: true
    ownership: owned
    template: resources/ecr_repo_template.yaml
    stack_name: "{project}-rag-lambda-ecr-{env}"
    config:
      repository_name: "{project}-rag-lambda-{env}"
      max_image_count: 5 # only this many images retained; older ones expired automatically
  # ECR repository for History API Lambda
  history_api_lambda_ecr:
    enabled: true
    ownership: owned
    template: resources/ecr_repo_template.yaml
    stack_name: "{project}-history-api-lambda-ecr-{env}"
    config:
      repository_name: "{project}-history-api-lambda-{env}"
      max_image_count: 5
  # ECR repository for Document Ingestion Lambda
  document_ingestion_lambda_ecr:
    enabled: true
    ownership: owned
    template: resources/ecr_repo_template.yaml
    stack_name: "{project}-document-ingestion-lambda-ecr-{env}"
    config:
      repository_name: "{project}-document-ingestion-lambda-{env}"
      max_image_count: 5
  # Frontend static site (S3 + CloudFront)
  # Deployed before cognito so deploy_cognito.sh can read the CloudFront output
  # and append the deployed origin to CallbackUrls/LogoutUrls automatically.
  frontend:
    enabled: true
    ownership: owned
    template: resources/frontend_static_site_template.yaml
    stack_name: "{project}-frontend-{env}"
    config:
      price_class: PriceClass_100
  # Cognito auth for frontend + API JWT validation
  cognito:
    enabled: true
    ownership: owned
    template: resources/cognito_template.yaml
    stack_name: "{project}-cognito-{env}"
    config:
      user_pool_name: "{project}-{env}-users"
      app_client_name: "{project}-{env}-spa-client"
      callback_urls: "http://localhost:5173/auth/callback"
      logout_urls: "http://localhost:5173/"
      # Hosted UI domain prefix. Must be globally unique per region.
      # {project}-{env} resolves to e.g. "chat-template-sandbox". If you hit a
      # collision with another AWS account, override per-env or pass
      # --domain-prefix to the cognito handler.
      domain_prefix: "{project}-{env}"
      generate_client_secret: false
  # RAG Lambda function
  rag_lambda:
    enabled: true
    ownership: owned
    template: resources/lambda_template.yaml
    stack_name: "{project}-rag-lambda-{env}"
    config:
      function_name: "{project}-{env}-rag-chat"
      memory_size: 1024
      timeout: 300
      s3_app_config_uri: "s3://{project}-{env}-s3-{global_suffix}/config/app_config.yaml"
      auth_required: "true"
      cognito_region: "${COGNITO_REGION}"
      cognito_user_pool_id: "${COGNITO_USER_POOL_ID}"
      cognito_app_client_id: "${COGNITO_APP_CLIENT_ID}"
      # Optional override via hydrate secret FUNCTION_URL_CORS_ALLOW_ORIGINS.
      function_url_cors_allow_origins: "http://localhost:5173"
      function_url_cors_allow_headers: "Content-Type,Authorization"
      function_url_cors_allow_methods: "POST"
      function_url_cors_max_age: 600
  # History API Lambda — read/admin endpoints for chat conversations
  history_api_lambda:
    enabled: true
    ownership: owned
    template: resources/history_api_lambda_template.yaml
    stack_name: "{project}-history-api-lambda-{env}"
    config:
      function_name: "{project}-{env}-history-api"
      memory_size: 512
      timeout: 30
      s3_app_config_uri: "s3://{project}-{env}-s3-{global_suffix}/config/app_config.yaml"
      auth_required: "true"
      cognito_region: "${COGNITO_REGION}"
      cognito_user_pool_id: "${COGNITO_USER_POOL_ID}"
      cognito_app_client_id: "${COGNITO_APP_CLIENT_ID}"
      function_url_cors_allow_origins: "http://localhost:5173"
      function_url_cors_allow_headers: "Content-Type,Authorization"
      function_url_cors_allow_methods: "GET,POST,DELETE"
      function_url_cors_max_age: 600
  # Document Ingestion Lambda — first slice processes PDF uploads in kb_landing/
  # into the durable metadata/raw-document layout. Later phases will add chunk
  # indexes, artifact extraction, catalogs, and Bedrock KB sync orchestration.
  document_ingestion_lambda:
    enabled: true
    ownership: owned
    template: resources/document_ingestion_lambda_template.yaml
    stack_name: "{project}-document-ingestion-lambda-{env}"
    config:
      function_name: "{project}-{env}-document-ingestion"
      memory_size: 1024
      timeout: 300
      s3_app_config_uri: "s3://{project}-{env}-s3-{global_suffix}/config/app_config.yaml"
      document_bucket_name: "{project}-{env}-s3-{global_suffix}"
      landing_prefix: "kb_landing/"
      raw_prefix: "kb_raw/"
      index_prefix: "kb_index/"
      artifacts_prefix: "kb_artifacts/"
      catalog_prefix: "kb_catalog/{env}/"
      default_tenant_id: "{env}"
      default_collection_id: "default"
      pdf_text_probe_pages: 5
