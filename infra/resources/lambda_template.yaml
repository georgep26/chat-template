AWSTemplateFormatVersion: '2010-09-09'
Description: 'RAG Chat Lambda Function - CloudFormation Template'

Parameters:
  ProjectName:
    Type: String
    Default: 'chat-template'
    Description: 'Name of the project'
  
  Environment:
    Type: String
    Default: 'dev'
    AllowedValues: ['dev', 'staging', 'prod']
    Description: 'Environment name'
  
  AWSRegion:
    Type: String
    Default: 'us-east-1'
    Description: 'AWS region'
  
  LambdaImageUri:
    Type: String
    Description: 'URI of the Lambda container image in ECR (e.g., 123456789012.dkr.ecr.us-east-1.amazonaws.com/rag-lambda:latest)'
  
  LambdaMemorySize:
    Type: Number
    Default: 1024
    Description: 'Memory size for Lambda function in MB'
    MinValue: 128
    MaxValue: 10240
  
  LambdaTimeout:
    Type: Number
    Default: 300
    Description: 'Timeout for Lambda function in seconds'
    MinValue: 3
    MaxValue: 900
  
  VpcId:
    Type: String
    Default: ''
    Description: 'VPC ID where the Lambda will be deployed (optional, required only for postgres backend with direct RDS access)'
  
  SubnetIds:
    Type: String
    Default: ''
    Description: 'Comma-delimited list of subnet IDs for Lambda (optional, required only when VpcId is provided)'
  
  SecurityGroupIds:
    Type: String
    Default: ''
    Description: 'Comma-delimited list of security group IDs for Lambda (optional, required only when VpcId is provided)'
  
  DBSecretArn:
    Type: String
    Default: ''
    Description: 'ARN of the Secrets Manager secret containing database credentials (optional, required only for postgres backend)'
  
  KnowledgeBaseId:
    Type: String
    Default: ''
    Description: 'AWS Bedrock Knowledge Base ID for retrieval'
  
  AppConfigPath:
    Type: String
    Default: 'config/app_config.yaml'
    Description: 'Path to app config file (local path or S3 URI like s3://bucket/key)'
  
  ConfigS3Bucket:
    Type: String
    Default: ''
    Description: 'S3 bucket name for config file (optional, extracted from AppConfigPath if S3 URI)'
  
  LambdaExecutionRoleArn:
    Type: String
    Description: 'ARN of the Lambda execution role (from lambda_execution_role stack)'

  AuthRequired:
    Type: String
    Default: ''
    AllowedPattern: '^(|true|false)$'
    Description: 'Optional override for JWT auth requirement. When empty, defaults to true in all environments.'

  CognitoRegion:
    Type: String
    Default: ''
    Description: 'AWS region for Cognito user pool (required when auth is enabled)'

  CognitoUserPoolId:
    Type: String
    Default: ''
    Description: 'Cognito User Pool ID (required when auth is enabled)'

  CognitoAppClientId:
    Type: String
    Default: ''
    Description: 'Cognito App Client ID (required when auth is enabled)'

  FunctionUrlCorsAllowOrigins:
    Type: CommaDelimitedList
    Default: 'http://localhost:5173'
    Description: 'Allowed CORS origins for the Lambda Function URL'

  FunctionUrlCorsAllowHeaders:
    Type: CommaDelimitedList
    Default: 'Content-Type,Authorization'
    Description: 'Allowed CORS headers for the Lambda Function URL'

  FunctionUrlCorsAllowMethods:
    Type: CommaDelimitedList
    Default: 'POST'
    Description: 'Allowed CORS methods for the Lambda Function URL (OPTIONS is handled automatically for preflight)'

  FunctionUrlCorsMaxAge:
    Type: Number
    Default: 600
    Description: 'CORS max age in seconds for preflight caching'

Conditions:
  IsProduction: !Equals [!Ref Environment, 'prod']
  HasAuthRequiredOverride: !Not [!Equals [!Ref AuthRequired, '']]
  HasVpcConfig: !And
    - !Not [!Equals [!Ref VpcId, '']]
    - !Not [!Equals [!Ref SubnetIds, '']]
    - !Not [!Equals [!Ref SecurityGroupIds, '']]
  HasConfigS3Bucket: !Not [!Equals [!Ref ConfigS3Bucket, '']]

Resources:
  # CloudWatch Log Group
  LambdaLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${ProjectName}-${Environment}-rag-chat'
      RetentionInDays: !If [IsProduction, 30, 7]
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${Environment}-rag-chat-logs'
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: !Ref ProjectName

  # Lambda Function
  RAGChatLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-${Environment}-rag-chat'
      Description: 'RAG Chat Lambda function with LangGraph orchestration'
      PackageType: Image
      Code:
        ImageUri: !Ref LambdaImageUri
      Role: !Ref LambdaExecutionRoleArn
      MemorySize: !Ref LambdaMemorySize
      Timeout: !Ref LambdaTimeout
      Environment:
        Variables:
          APP_CONFIG_PATH: !Ref AppConfigPath
          ENVIRONMENT: !Ref Environment
          AUTH_REQUIRED: !If
            - HasAuthRequiredOverride
            - !Ref AuthRequired
            - 'true'
          COGNITO_REGION: !Ref CognitoRegion
          COGNITO_USER_POOL_ID: !Ref CognitoUserPoolId
          COGNITO_APP_CLIENT_ID: !Ref CognitoAppClientId
      VpcConfig: !If
        - HasVpcConfig
        - SubnetIds: !Split [',', !Ref SubnetIds]
          SecurityGroupIds: !Split [',', !Ref SecurityGroupIds]
        - !Ref 'AWS::NoValue'
      LoggingConfig:
        LogFormat: JSON
        LogGroup: !Ref LambdaLogGroup
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${Environment}-rag-chat'
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: !Ref ProjectName

  RAGChatFunctionUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !GetAtt RAGChatLambda.Arn
      AuthType: NONE
      Cors:
        AllowOrigins: !Ref FunctionUrlCorsAllowOrigins
        AllowHeaders: !Ref FunctionUrlCorsAllowHeaders
        AllowMethods: !Ref FunctionUrlCorsAllowMethods
        MaxAge: !Ref FunctionUrlCorsMaxAge

  RAGChatFunctionUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunctionUrl
      FunctionName: !Ref RAGChatLambda
      Principal: '*'
      FunctionUrlAuthType: NONE

  RAGChatFunctionInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref RAGChatLambda
      Principal: '*'
      InvokedViaFunctionUrl: true

  # Inline policy to grant S3 access for config bucket
  # Extract role name from ARN (format: arn:aws:iam::account:role/role-name)
  LambdaConfigS3Policy:
    Type: AWS::IAM::Policy
    Condition: HasConfigS3Bucket
    Properties:
      PolicyName: !Sub '${ProjectName}-${Environment}-lambda-config-s3-policy'
      Roles:
        - !Select 
          - 1
          - !Split 
            - '/'
            - !Ref LambdaExecutionRoleArn
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowS3ConfigRead
            Effect: Allow
            Action:
              - s3:GetObject
            Resource: !Sub 'arn:aws:s3:::${ConfigS3Bucket}/*'
          - Sid: AllowS3BucketList
            Effect: Allow
            Action:
              - s3:ListBucket
            Resource: !Sub 'arn:aws:s3:::${ConfigS3Bucket}'

Outputs:
  LambdaFunctionName:
    Description: 'Name of the Lambda function'
    Value: !Ref RAGChatLambda
    Export:
      Name: !Sub '${AWS::StackName}-LambdaFunctionName'
  
  LambdaFunctionArn:
    Description: 'ARN of the Lambda function'
    Value: !GetAtt RAGChatLambda.Arn
    Export:
      Name: !Sub '${AWS::StackName}-LambdaFunctionArn'
  
  LambdaLogGroupName:
    Description: 'Name of the CloudWatch Log Group'
    Value: !Ref LambdaLogGroup
    Export:
      Name: !Sub '${AWS::StackName}-LambdaLogGroupName'

  LambdaFunctionUrl:
    Description: 'Function URL for the Lambda function'
    Value: !GetAtt RAGChatFunctionUrl.FunctionUrl
    Export:
      Name: !Sub '${AWS::StackName}-LambdaFunctionUrl'
