# Account-specific deployment values.
# Copy this file to infra/secrets/accounts.secrets.yaml and fill in real values.
# Do not commit accounts.secrets.yaml.

accounts:
  management:
    account_id: "111122223333"
    account_name: "management-account"
    bootstrap_profile: "management-admin"
    deploy_profile: "management-admin"
    cli_profile: "management-admin"
    global_suffix: "mgmt001"

  default_dev:
    account_id: "222233334444"
    account_name: "chat-template-dev"
    organization_access_role: "OrganizationAccountAccessRole"
    bootstrap_profile: "management-admin"
    deploy_profile: "chat-template-dev-deployer"
    cli_profile: "chat-template-dev-cli"
    cli_role_name: "chat-template-dev-admin-cli-role"
    global_suffix: "dev001"

  default_staging:
    account_id: "333344445555"
    account_name: "chat-template-staging"
    organization_access_role: "OrganizationAccountAccessRole"
    bootstrap_profile: "management-admin"
    deploy_profile: "chat-template-staging-deployer"
    cli_profile: "chat-template-staging-cli"
    cli_role_name: "chat-template-staging-admin-cli-role"
    global_suffix: "stg001"

  default_prod:
    account_id: "444455556666"
    account_name: "chat-template-prod"
    organization_access_role: "OrganizationAccountAccessRole"
    bootstrap_profile: "management-admin"
    deploy_profile: "chat-template-prod-deployer"
    cli_profile: "chat-template-prod-cli"
    cli_role_name: "chat-template-prod-admin-cli-role"
    global_suffix: "prod001"

  sandbox:
    account_id: "555566667777"
