# Sensitive values are read from GitHub environment secrets for environments
# with ci_cd.enabled: true in infra/infra.yaml.
# Set these in GitHub: Settings → Environments → <env> → Environment secrets.
# See docs/github_environment_secrets.md for secret names.
#
# Role Strategy:
#   deploy_all.sh reads infra/infra.yaml and deploys the selected deployment set
#   in YAML resource order. To change the CI/CD deployment surface, adjust
#   deployment_sets in infra.yaml instead of passing per-resource skip flags.
name: Deploy Application

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        type: string
      deployment_set:
        description: 'Deployment set from infra.yaml'
        required: false
        type: string
        default: full
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      deployment_set:
        required: false
        type: string
        default: full

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      id-token: write
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOYER_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}
        env:
          AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          yq --version

      - name: Hydrate configs
        if: vars.HYDRATE_CONFIGS != 'false'
        env:
          BUDGET_EMAIL: ${{ secrets.BUDGET_EMAIL }}
          REPO: ${{ secrets.REPO }}
          DEPLOYER_ROLE_ARN: ${{ secrets.DEPLOYER_ROLE_ARN }}
          VPC_ID: ${{ secrets.VPC_ID }}
          SUBNET_IDS: ${{ secrets.SUBNET_IDS }}
          KNOWLEDGE_BASE_ID: ${{ secrets.KNOWLEDGE_BASE_ID }}
          DB_CLUSTER_ARN: ${{ secrets.DB_CLUSTER_ARN }}
          DB_CREDENTIALS_SECRET_ARN: ${{ secrets.DB_CREDENTIALS_SECRET_ARN }}
          COGNITO_REGION: ${{ secrets.COGNITO_REGION }}
          COGNITO_USER_POOL_ID: ${{ secrets.COGNITO_USER_POOL_ID }}
          COGNITO_APP_CLIENT_ID: ${{ secrets.COGNITO_APP_CLIENT_ID }}
          COGNITO_CALLBACK_URLS: ${{ secrets.COGNITO_CALLBACK_URLS }}
          COGNITO_LOGOUT_URLS: ${{ secrets.COGNITO_LOGOUT_URLS }}
          COGNITO_DOMAIN_PREFIX: ${{ secrets.COGNITO_DOMAIN_PREFIX }}
          COGNITO_GENERATE_CLIENT_SECRET: ${{ secrets.COGNITO_GENERATE_CLIENT_SECRET }}
          FUNCTION_URL_CORS_ALLOW_ORIGINS: ${{ secrets.FUNCTION_URL_CORS_ALLOW_ORIGINS }}
        run: |
          ./scripts/utils/hydrate_configs.sh ${{ inputs.environment }}

      - name: Run deployment
        id: deploy
        run: ./scripts/deploy/deploy_all.sh ${{ inputs.environment }} --set ${{ inputs.deployment_set }} -y
        env:
          AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
          ACCOUNT_ID: ${{ secrets.ACCOUNT_ID }}
          GLOBAL_SUFFIX: ${{ secrets.GLOBAL_SUFFIX }}

      - name: Deployment summary
        if: always()
        run: |
          if [ "${{ steps.deploy.outcome }}" == "success" ]; then
            echo "✅ Deployment to ${{ inputs.environment }} completed successfully!"
          else
            echo "❌ Deployment to ${{ inputs.environment }} failed. Check logs above for details."
            exit 1
          fi
