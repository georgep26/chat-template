# Reports "Run Tests" as success for bot chore PRs that only touch allowlisted paths,
# so they can merge without running the full test suite or a bypass token.
# Only runs for PRs from bot/evals-results, bot/release-changelog, or bot/aggregate-evals
# when all changed files are under evals/eval_outputs/, CHANGELOG.md, or docs/pr_evals_results/.
name: Chore PR Status

on:
  pull_request:
    branches: [main]
    paths:
      - 'evals/eval_outputs/**'
      - 'CHANGELOG.md'
      - 'docs/pr_evals_results/**'

permissions:
  contents: read
  statuses: write

jobs:
  report-run-tests-success:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if PR is allowlisted chore-only
        id: chore-only
        run: |
          HEAD_REF="${{ github.head_ref }}"
          ALLOWED_BRANCHES="bot/evals-results bot/release-changelog bot/aggregate-evals"
          is_bot_branch() {
            case "$HEAD_REF" in
              bot/evals-results|bot/release-changelog|bot/aggregate-evals) return 0 ;;
              *) return 1 ;;
            esac
          }
          if ! is_bot_branch; then
            echo "chore_only=false" >> $GITHUB_OUTPUT
            echo "Head branch '$HEAD_REF' is not an allowlisted chore branch; not reporting"
            exit 0
          fi
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          CHANGED=$(git diff --name-only "$BASE" "$HEAD" || true)
          if [ -z "$CHANGED" ]; then
            echo "chore_only=false" >> $GITHUB_OUTPUT
            echo "No changed files"
            exit 0
          fi
          NON_CHORE=$(echo "$CHANGED" | while read -r p; do
            case "$p" in
              evals/eval_outputs/*) ;;
              CHANGELOG.md) ;;
              docs/pr_evals_results/*) ;;
              *) echo "$p"; break ;;
            esac
          done)
          if [ -z "$NON_CHORE" ]; then
            echo "chore_only=true" >> $GITHUB_OUTPUT
            echo "Chore-only PR from $HEAD_REF; reporting Run Tests success"
          else
            echo "chore_only=false" >> $GITHUB_OUTPUT
            echo "PR has non-chore changes; not reporting (main PR workflow will report)"
          fi

      - name: Set Run Tests status to success
        if: steps.chore-only.outputs.chore_only == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          gh api "/repos/${{ github.repository }}/statuses/${{ github.event.pull_request.head.sha }}" \
            -f context="Run Tests" \
            -f state="success" \
            -f description="Chore-only PR; no tests required" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
