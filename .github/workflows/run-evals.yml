name: Run Evaluations

# When run on its own (workflow_dispatch), these apply. When called (workflow_call), the caller must
# grant at least these permissions. For upload_to_main, caller must also grant pull-requests: write.
permissions:
  id-token: write   # required for AWS credential federation
  contents: write   # required for creating chore PR
  pull-requests: write  # required when upload_to_main is true

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to run evals against (dev, staging, or prod)'
        required: true
        default: 'staging'
        type: choice
        options:
          - dev
          - staging
          - prod
      skip_branch_check:
        description: 'Skip branch check (allow running from any branch)'
        required: false
        default: 'false'
        type: boolean
      upload_to_main:
        description: 'Create chore PR with eval results to main; chore status workflow sets Run Tests, then merge with GITHUB_TOKEN'
        required: false
        default: 'false'
        type: boolean
  workflow_call:
    inputs:
      environment:
        description: 'Environment to run evals against (dev, staging, or prod)'
        required: true
        default: 'staging'
        type: string
      upload_to_main:
        description: 'Create chore PR with eval results to main; chore status workflow then GITHUB_TOKEN merge'
        required: false
        default: false
        type: boolean

jobs:
  run-evals:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || github.event.inputs.environment || 'staging' }}
    # Permissions are inherited from the caller. Callers that push to main (e.g. deploy_prod_on_merge)
    # must pass permissions: { id-token: write, contents: write }; others (e.g. pull_request) pass contents: read.
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if PR is from development branch
        id: check-branch
        run: |
          # For manual runs, check the skip_branch_check input
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            if [ "${{ github.event.inputs.skip_branch_check || inputs.skip_branch_check || 'false' }}" == "true" ]; then
              echo "Manual run with branch check skipped. Running evaluation."
              echo "skip=false" >> $GITHUB_OUTPUT
              exit 0
            fi
          fi
          
          # For pull requests, check if PR is from development branch
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            PR_BRANCH="${{ github.head_ref }}"
            if [ "$PR_BRANCH" != "development" ]; then
              echo "PR is from branch '$PR_BRANCH', not 'development'. Skipping evaluation."
              echo "skip=true" >> $GITHUB_OUTPUT
              exit 0
            else
              echo "PR is from 'development' branch. Running evaluation."
              echo "skip=false" >> $GITHUB_OUTPUT
            fi
          else
            # Manual run without skip flag - check current branch
            CURRENT_BRANCH="${{ github.ref_name }}"
            if [ "$CURRENT_BRANCH" != "development" ] && [ "$CURRENT_BRANCH" != "main" ]; then
              echo "Current branch '$CURRENT_BRANCH' is not 'development' or 'main'. Skipping evaluation."
              echo "skip=true" >> $GITHUB_OUTPUT
              exit 0
            else
              echo "Running evaluation on branch '$CURRENT_BRANCH'."
              echo "skip=false" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Generate run name for upload to main
        if: steps.check-branch.outputs.skip != 'true' && (inputs.upload_to_main == 'true' || inputs.upload_to_main == true || github.event.inputs.upload_to_main == 'true')
        id: generate-run-name
        run: echo "run_name=$(date -u +%Y-%m-%dT%H-%M-%SZ)" >> $GITHUB_OUTPUT

      - name: Set up Miniconda
        if: steps.check-branch.outputs.skip != 'true'
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          python-version: '3.11'
          environment-file: environment.yml
          activate-environment: chat-template-env

      - name: Verify conda environment
        if: steps.check-branch.outputs.skip != 'true'
        shell: bash -l {0}
        run: |
          conda info
          conda list

      - name: Configure AWS credentials
        if: steps.check-branch.outputs.skip != 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_EVALS_ROLE_ARN }}
          aws-region: us-east-1
        env:
          AWS_REGION: us-east-1

      - name: Set PYTHONPATH
        if: steps.check-branch.outputs.skip != 'true'
        shell: bash -l {0}
        run: |
          echo "PYTHONPATH=${{ github.workspace }}:${{ github.workspace }}/src/rag_lambda:${{ github.workspace }}/src" >> $GITHUB_ENV

      - name: Run evaluation pipeline
        if: steps.check-branch.outputs.skip != 'true'
        shell: bash -l {0}
        env:
          EVALS_ENVIRONMENT: ${{ inputs.environment || github.event.inputs.environment || 'staging' }}
          EVAL_RUN_NAME: ${{ steps.generate-run-name.outputs.run_name }}
        run: |
          if [ -n "$EVAL_RUN_NAME" ]; then
            python evals/evals_pipeline.py --config evals/evals_config.yaml --notes "PR Evaluation" --environment "$EVALS_ENVIRONMENT" --run-name "$EVAL_RUN_NAME"
          else
            python evals/evals_pipeline.py --config evals/evals_config.yaml --notes "PR Evaluation" --environment "$EVALS_ENVIRONMENT"
          fi

      - name: Upload evaluation results
        if: steps.check-branch.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: evals/eval_outputs/
          retention-days: 7

      # Stage only the new eval output dir (path is in .gitignore) for the PR.
      - name: Stage eval results for PR
        if: steps.check-branch.outputs.skip != 'true' && (inputs.upload_to_main == 'true' || inputs.upload_to_main == true || github.event.inputs.upload_to_main == 'true')
        run: |
          RUN_NAME="${{ steps.generate-run-name.outputs.run_name }}"
          if [ ! -d "evals/eval_outputs/$RUN_NAME" ]; then
            echo "No eval output dir found at evals/eval_outputs/$RUN_NAME"
            exit 1
          fi
          git add -f "evals/eval_outputs/$RUN_NAME"
          git status

      - name: Create pull request for eval results
        if: steps.check-branch.outputs.skip != 'true' && (inputs.upload_to_main == 'true' || inputs.upload_to_main == true || github.event.inputs.upload_to_main == 'true')
        id: cpr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: bot/evals-results
          base: main
          add-paths: |
            evals/eval_outputs/
          commit-message: |
            chore(evals): add eval results ${{ steps.generate-run-name.outputs.run_name }} [skip ci]
          title: "chore(evals): add eval results to main"
          body: |
            Automated eval results from production run.
            Run name: `${{ steps.generate-run-name.outputs.run_name }}`
            [skip ci]
          labels: |
            auto-generated
            evals

      # Chore PR Status workflow sets "Run Tests" success for this PR; wait then merge with GITHUB_TOKEN.
      - name: Wait for Run Tests status and merge chore PR
        if: steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHA="${{ steps.cpr.outputs.pull-request-head-sha }}"
          PR_NUM="${{ steps.cpr.outputs.pull-request-number }}"
          echo "Waiting for 'Run Tests' status on $SHA (PR #$PR_NUM)..."
          for i in $(seq 1 24); do
            STATE=$(gh api "/repos/${{ github.repository }}/commits/$SHA/status" -q '.statuses[] | select(.context == "Run Tests") | .state' 2>/dev/null || true)
            if [ "$STATE" = "success" ]; then
              echo "Run Tests passed; merging PR."
              gh pr merge "$PR_NUM" --squash
              exit 0
            fi
            echo "Attempt $i/24: Run Tests state=${STATE:-pending}; waiting 10s..."
            sleep 10
          done
          echo "Timeout waiting for Run Tests; PR left open for manual merge."
          exit 0

      # - name: Merge main into development
      #   if: steps.check-branch.outputs.skip != 'true' && (inputs.upload_to_main == 'true' || inputs.upload_to_main == true || github.event.inputs.upload_to_main == 'true')
      #   run: |
      #     git fetch origin main development
      #     git checkout development
      #     git pull origin development
      #     git merge origin/main -m "chore: sync development with main (eval results) [skip ci]"
      #     git push origin development

