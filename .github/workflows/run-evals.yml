name: Run Evaluations

# When run on its own (workflow_dispatch), these apply. When called (workflow_call), the caller must
# grant at least these permissions. For upload_to_main, caller must also grant pull-requests: write.
permissions:
  id-token: write   # required for AWS credential federation
  contents: write   # required for creating chore PR
  pull-requests: write  # required when upload_to_main is true
  statuses: write   # required to set Run Tests status when we create the PR (GITHUB_TOKEN-created PRs do not trigger other workflows)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to run evals against (dev, staging, or prod)'
        required: true
        default: 'staging'
        type: choice
        options:
          - dev
          - staging
          - prod
      skip_branch_check:
        description: 'Skip branch check (allow running from any branch)'
        required: false
        default: 'false'
        type: boolean
      upload_to_main:
        description: 'Create chore PR with eval results to main; chore status workflow sets Run Tests, then merge with GITHUB_TOKEN'
        required: false
        default: 'false'
        type: boolean
  workflow_call:
    inputs:
      environment:
        description: 'Environment to run evals against (dev, staging, or prod)'
        required: true
        default: 'staging'
        type: string
      upload_to_main:
        description: 'Create chore PR with eval results to main; chore status workflow then GITHUB_TOKEN merge'
        required: false
        default: false
        type: boolean

jobs:
  run-evals:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || github.event.inputs.environment || 'staging' }}
    # Permissions are inherited from the caller. Callers that push to main (e.g. deploy_prod_on_merge)
    # must pass permissions: { id-token: write, contents: write }; others (e.g. pull_request) pass contents: read.
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if PR is from development branch
        id: check-branch
        run: |
          # For manual runs, check the skip_branch_check input
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            if [ "${{ github.event.inputs.skip_branch_check || inputs.skip_branch_check || 'false' }}" == "true" ]; then
              echo "Manual run with branch check skipped. Running evaluation."
              echo "skip=false" >> $GITHUB_OUTPUT
              exit 0
            fi
          fi
          
          # For pull requests, check if PR is from development branch
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            PR_BRANCH="${{ github.head_ref }}"
            if [ "$PR_BRANCH" != "development" ]; then
              echo "PR is from branch '$PR_BRANCH', not 'development'. Skipping evaluation."
              echo "skip=true" >> $GITHUB_OUTPUT
              exit 0
            else
              echo "PR is from 'development' branch. Running evaluation."
              echo "skip=false" >> $GITHUB_OUTPUT
            fi
          else
            # Manual run without skip flag - check current branch
            CURRENT_BRANCH="${{ github.ref_name }}"
            if [ "$CURRENT_BRANCH" != "development" ] && [ "$CURRENT_BRANCH" != "main" ]; then
              echo "Current branch '$CURRENT_BRANCH' is not 'development' or 'main'. Skipping evaluation."
              echo "skip=true" >> $GITHUB_OUTPUT
              exit 0
            else
              echo "Running evaluation on branch '$CURRENT_BRANCH'."
              echo "skip=false" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Get release tag from merged PR
        if: steps.check-branch.outputs.skip != 'true' && (inputs.upload_to_main == 'true' || inputs.upload_to_main == true || github.event.inputs.upload_to_main == 'true')
        id: get-release-tag
        uses: actions/github-script@v7
        with:
          script: |
            const commitSha = context.sha;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            async function getPrIfMatch(prNumber) {
              const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: prNumber });
              const isBaseMain = pr.base && pr.base.ref === 'main';
              const isHeadDev = pr.head && pr.head.ref === 'development';
              const mergeShaMatches = pr.merge_commit_sha && pr.merge_commit_sha === commitSha;
              if (isBaseMain && isHeadDev && mergeShaMatches) return pr;
              return null;
            }

            let mergedPR = null;
            const { data: pulls } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner, repo, commit_sha: commitSha
            });
            mergedPR = pulls.find(pr => pr.base?.ref === 'main' && pr.head?.ref === 'development');

            if (!mergedPR) {
              const { data: commit } = await github.rest.repos.getCommit({ owner, repo, ref: commitSha });
              const msg = (commit.commit?.message) || '';
              const firstLine = msg.split(/\r?\n/)[0] || '';
              const mergeMatch = msg.match(/Merge pull request #(\d+)/i);
              const squashMatch = firstLine.match(/\(#(\d+)\)\s*$/) || msg.match(/\(#(\d+)\)/);
              const prNum = mergeMatch?.[1] || squashMatch?.[1];
              if (prNum) mergedPR = await getPrIfMatch(parseInt(prNum, 10));
            }

            if (!mergedPR) {
              const { data: closedPulls } = await github.rest.pulls.list({
                owner, repo, state: 'closed', base: 'main', sort: 'updated', direction: 'desc', per_page: 15
              });
              for (const p of closedPulls) {
                if (p.head?.ref !== 'development') continue;
                const full = await getPrIfMatch(p.number);
                if (full) { mergedPR = full; break; }
              }
            }

            let releaseTag = '';
            if (mergedPR) {
              const pr = mergedPR.number ? (await github.rest.pulls.get({ owner, repo, pull_number: mergedPR.number })).data : mergedPR;
              const body = pr.body || '';
              const match = body.match(/\*\*Release Tag:\*\*\s*`([^`]+)`/i) || body.match(/Release Tag:\s*`([^`]+)`/i);
              releaseTag = match ? match[1].trim() : '';
            }
            core.setOutput('release_tag', releaseTag);

      - name: Generate run name for upload to main
        if: steps.check-branch.outputs.skip != 'true' && (inputs.upload_to_main == 'true' || inputs.upload_to_main == true || github.event.inputs.upload_to_main == 'true')
        id: generate-run-name
        run: |
          TIMESTAMP=$(date -u +%Y-%m-%dT%H-%M-%SZ)
          RELEASE_TAG="${{ steps.get-release-tag.outputs.release_tag }}"
          if [ -n "$RELEASE_TAG" ]; then
            echo "run_name=${TIMESTAMP}_${RELEASE_TAG}" >> $GITHUB_OUTPUT
          else
            echo "run_name=$TIMESTAMP" >> $GITHUB_OUTPUT
          fi

      - name: Set up Miniconda
        if: steps.check-branch.outputs.skip != 'true'
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          python-version: '3.11'
          environment-file: environment.yml
          activate-environment: chat-template-env

      - name: Verify conda environment
        if: steps.check-branch.outputs.skip != 'true'
        shell: bash -l {0}
        run: |
          conda info
          conda list

      - name: Configure AWS credentials
        if: steps.check-branch.outputs.skip != 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_EVALS_ROLE_ARN }}
          aws-region: us-east-1
        env:
          AWS_REGION: us-east-1

      - name: Set PYTHONPATH
        if: steps.check-branch.outputs.skip != 'true'
        shell: bash -l {0}
        run: |
          echo "PYTHONPATH=${{ github.workspace }}:${{ github.workspace }}/src/rag_lambda:${{ github.workspace }}/src" >> $GITHUB_ENV

      - name: Run evaluation pipeline
        if: steps.check-branch.outputs.skip != 'true'
        shell: bash -l {0}
        env:
          EVALS_ENVIRONMENT: ${{ inputs.environment || github.event.inputs.environment || 'staging' }}
          EVAL_RUN_NAME: ${{ steps.generate-run-name.outputs.run_name }}
        run: |
          if [ -n "$EVAL_RUN_NAME" ]; then
            python evals/evals_pipeline.py --config evals/evals_config.yaml --notes "PR Evaluation" --environment "$EVALS_ENVIRONMENT" --run-name "$EVAL_RUN_NAME"
          else
            python evals/evals_pipeline.py --config evals/evals_config.yaml --notes "PR Evaluation" --environment "$EVALS_ENVIRONMENT"
          fi

      - name: Upload evaluation results
        if: steps.check-branch.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: evals/eval_outputs/
          retention-days: 7

      - name: Build eval results comment for PR
        if: steps.check-branch.outputs.skip != 'true' && github.event_name == 'pull_request'
        id: eval-comment
        shell: bash -l {0}
        run: |
          SUMMARY_JSON=$(find evals/eval_outputs -name 'summary.json' -type f | head -1)
          if [ -z "$SUMMARY_JSON" ]; then
            echo "No summary.json found; skipping comment."
            echo "comment_path=" >> $GITHUB_OUTPUT
            exit 0
          fi
          export SUMMARY_JSON
          python << 'PYEOF'
          import json
          import os
          from pathlib import Path

          summary_path = os.environ.get("SUMMARY_JSON")
          if not summary_path or not Path(summary_path).exists():
              summary_path = next(Path("evals/eval_outputs").rglob("summary.json"), None)
          if not summary_path or not Path(summary_path).exists():
              Path("eval-comment.md").write_text("")
              raise SystemExit(0)
          summary_path = Path(summary_path)

          with open(summary_path) as f:
              data = json.load(f)

          metrics = data.get("metrics", {})
          run_info = data.get("run", {})

          lines = [
              "## 📊 Evaluation Results",
              "",
              "| Metric | Mean | Std | Min | Max |",
              "|--------|------|-----|-----|-----|",
          ]
          for name, m in sorted(metrics.items()):
              mean = m.get("mean")
              std = m.get("std")
              lo = m.get("min")
              hi = m.get("max")
              if mean is not None:
                  mean_s = f"{mean:.4f}" if isinstance(mean, float) else str(mean)
                  std_s = f"{std:.4f}" if std is not None and isinstance(std, float) else (str(std) if std is not None else "—")
                  lo_s = f"{lo:.4f}" if lo is not None and isinstance(lo, (int, float)) else (str(lo) if lo is not None else "—")
                  hi_s = f"{hi:.4f}" if hi is not None and isinstance(hi, (int, float)) else (str(hi) if hi is not None else "—")
                  lines.append(f"| {name} | {mean_s} | {std_s} | {lo_s} | {hi_s} |")

          lines.extend([
              "",
              "**Run:** " + run_info.get("evaluation_run_name", "—") + " | " +
              "**Mode:** " + str(run_info.get("mode", "—")) + " | " +
              "**Validation questions:** " + str(run_info.get("num_validation_questions", "—")) + " | " +
              "**Timestamp:** " + str(run_info.get("run_timestamp", "—"))[:26],
              "",
          ])
          if run_info.get("notes"):
              lines.append("**Notes:** " + str(run_info["notes"]))

          Path("eval-comment.md").write_text("\n".join(lines))
          PYEOF
          # Pass path for next step (empty if no summary)
          if [ -f eval-comment.md ] && [ -s eval-comment.md ]; then
            echo "comment_path=eval-comment.md" >> $GITHUB_OUTPUT
          else
            echo "comment_path=" >> $GITHUB_OUTPUT
          fi

      - name: Post or update eval results comment on PR
        if: steps.check-branch.outputs.skip != 'true' && github.event_name == 'pull_request' && steps.eval-comment.outputs.comment_path != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const commentPath = '${{ steps.eval-comment.outputs.comment_path }}';
            if (!commentPath) return;
            const body = fs.readFileSync(commentPath, 'utf8');
            const prNumber = context.payload.pull_request?.number;
            if (!prNumber) return;

            const marker = '## 📊 Evaluation Results';
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });
            const botComment = comments.find(c =>
              c.user.type === 'Bot' && c.body && c.body.startsWith(marker)
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }

      # Stage only the new eval output dir (path is in .gitignore) for the PR.
      - name: Stage eval results for PR
        if: steps.check-branch.outputs.skip != 'true' && (inputs.upload_to_main == 'true' || inputs.upload_to_main == true || github.event.inputs.upload_to_main == 'true')
        run: |
          RUN_NAME="${{ steps.generate-run-name.outputs.run_name }}"
          if [ ! -d "evals/eval_outputs/$RUN_NAME" ]; then
            echo "No eval output dir found at evals/eval_outputs/$RUN_NAME"
            exit 1
          fi
          git add -f "evals/eval_outputs/$RUN_NAME"
          git status

      - name: Create pull request for eval results
        if: steps.check-branch.outputs.skip != 'true' && (inputs.upload_to_main == 'true' || inputs.upload_to_main == true || github.event.inputs.upload_to_main == 'true')
        id: cpr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: bot/evals-results
          base: main
          add-paths: |
            evals/eval_outputs/
          commit-message: |
            chore(evals): add eval results ${{ steps.generate-run-name.outputs.run_name }} [skip ci]
          title: "chore(evals): add eval results to main"
          body: |
            Automated eval results from production run.
            Run name: `${{ steps.generate-run-name.outputs.run_name }}`
            [skip ci]
          labels: |
            auto-generated
            evals

      # PRs created by GITHUB_TOKEN do not trigger other workflows; set "Run Tests" ourselves so branch protection is satisfied, then merge.
      - name: Set Run Tests status to success
        if: steps.cpr.outputs.pull-request-number != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "/repos/${{ github.repository }}/statuses/${{ steps.cpr.outputs.pull-request-head-sha }}" \
            -f context="Run Tests" \
            -f state="success" \
            -f description="Chore-only PR; no tests required" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Wait for Run Tests status and merge chore PR
        if: steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHA="${{ steps.cpr.outputs.pull-request-head-sha }}"
          PR_NUM="${{ steps.cpr.outputs.pull-request-number }}"
          echo "Waiting for 'Run Tests' status on $SHA (PR #$PR_NUM)..."
          for i in $(seq 1 24); do
            STATE=$(gh api "/repos/${{ github.repository }}/commits/$SHA/status" -q '.statuses[] | select(.context == "Run Tests") | .state' 2>/dev/null || true)
            if [ "$STATE" = "success" ]; then
              echo "Run Tests passed; merging PR."
              gh pr merge "$PR_NUM" --squash --delete-branch
              exit 0
            fi
            echo "Attempt $i/24: Run Tests state=${STATE:-pending}; waiting 10s..."
            sleep 10
          done
          echo "Timeout waiting for Run Tests; PR left open for manual merge."
          exit 0

      # - name: Merge main into development
      #   if: steps.check-branch.outputs.skip != 'true' && (inputs.upload_to_main == 'true' || inputs.upload_to_main == true || github.event.inputs.upload_to_main == 'true')
      #   run: |
      #     git fetch origin main development
      #     git checkout development
      #     git pull origin development
      #     git merge origin/main -m "chore: sync development with main (eval results) [skip ci]"
      #     git push origin development

