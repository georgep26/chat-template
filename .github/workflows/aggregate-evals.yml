name: Aggregate Evaluation Results

on:
  workflow_run:
    workflows: ["Run Evaluations"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      max_runs:
        description: 'Maximum number of evaluation runs to fetch'
        required: false
        default: '10'
        type: string

jobs:
  aggregate-evals:
    runs-on: ubuntu-latest
    # Only run if triggered by workflow_run and the evaluation workflow succeeded,
    # or if triggered manually via workflow_dispatch
    if: |
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
      pull-requests: write
      statuses: write
      actions: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          python-version: '3.11'
          environment-file: environment.yml
          activate-environment: chat-template-env

      - name: Verify conda environment
        shell: bash -l {0}
        run: |
          conda info
          conda list

      - name: Set PYTHONPATH
        shell: bash -l {0}
        run: |
          echo "PYTHONPATH=${{ github.workspace }}:${{ github.workspace }}/src/rag_lambda:${{ github.workspace }}/src" >> $GITHUB_ENV

      - name: Aggregate evaluation results
        shell: bash -l {0}
        env:
          MAX_RUNS: ${{ inputs.max_runs || '10' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Extract owner and repo from github.repository (format: owner/repo)
          REPO_OWNER="${{ github.repository_owner }}"
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          python evals/aggregate_evals.py \
            --owner "$REPO_OWNER" \
            --repo "$REPO_NAME" \
            --max-runs "$MAX_RUNS" \
            --output-dir docs/pr_evals_results

      - name: Check for changes
        id: check-changes
        shell: bash -l {0}
        run: |
          if [ -n "$(git status --porcelain docs/pr_evals_results)" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "Changes detected in evaluation results"
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No changes to evaluation results"
          fi

      - name: Create PR for aggregated eval results
        if: steps.check-changes.outputs.has_changes == 'true'
        id: agg-pr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: bot/aggregate-evals
          base: main
          add-paths: docs/pr_evals_results/
          commit-message: "Update evaluation results aggregation [skip ci]"
          title: "chore(docs): update aggregated evaluation results"
          body: "Automated aggregation of evaluation results."
          labels: auto-generated

      # PRs created by GITHUB_TOKEN do not trigger other workflows; set "Run Tests" success ourselves.
      - name: Set Run Tests status to success
        if: steps.agg-pr.outputs.pull-request-number != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "/repos/${{ github.repository }}/statuses/${{ steps.agg-pr.outputs.pull-request-head-sha }}" \
            -f context="Run Tests" \
            -f state="success" \
            -f description="Chore-only PR; no tests required" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Wait for Run Tests status and merge chore PR
        if: steps.agg-pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHA="${{ steps.agg-pr.outputs.pull-request-head-sha }}"
          PR_NUM="${{ steps.agg-pr.outputs.pull-request-number }}"
          echo "Waiting for 'Run Tests' status on $SHA (PR #$PR_NUM)..."
          for i in $(seq 1 24); do
            STATE=$(gh api "/repos/${{ github.repository }}/commits/$SHA/status" -q '.statuses[] | select(.context == "Run Tests") | .state' 2>/dev/null || true)
            if [ "$STATE" = "success" ]; then
              echo "Run Tests passed; merging PR."
              gh pr merge "$PR_NUM" --squash
              exit 0
            fi
            echo "Attempt $i/24: Run Tests state=${STATE:-pending}; waiting 10s..."
            sleep 10
          done
          echo "Timeout waiting for Run Tests; PR left open for manual merge."
          exit 0

