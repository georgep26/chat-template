# On merge to main (push to main): run tests, deploy prod from infra.yaml, then
# run evals in prod. After this workflow completes (including
# run-evaluations), Create Release on Merge to Main runs and creates the GitHub release.
# Pushes that only add eval results (evals/eval_outputs/**) do not trigger this workflow.
# Release eval results are written to evals/eval_outputs/published/<run_name>; local runs use evals/eval_outputs/local/ (gitignored).
#
# Standard process in this repo is config-driven deployment sets per environment.
name: Deploy to Prod on Merge to Main

on:
  push:
    branches: [main]
    paths-ignore:
      - 'evals/eval_outputs/**'
      - 'docs/pr_evals_results/**'
      - 'CHANGELOG.md'

permissions:
  checks: write
  contents: read
  id-token: write
  statuses: write

jobs:
  run-tests:
    name: Run Tests
    uses: ./.github/workflows/test.yml
    secrets: inherit
    permissions:
      checks: write
      contents: read
      pull-requests: write

  # Deploy prod using the PR/runtime deployment set declared in infra.yaml.
  deploy-prod:
    name: Deploy to Prod
    needs: [run-tests]
    uses: ./.github/workflows/deploy.yml
    with:
      environment: prod
      deployment_set: pr
    secrets: inherit

  # Run evals after deploy so they run within the newly deployed prod environment.
  # Results are written to evals/eval_outputs/published/<run_name> and committed to main via chore PR.
  run-evaluations:
    name: Run Evaluations
    needs: [deploy-prod]
    uses: ./.github/workflows/run-evals.yml
    with:
      environment: prod
      upload_to_main: true
    secrets: inherit
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      statuses: write
