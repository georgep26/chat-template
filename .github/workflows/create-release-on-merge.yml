# After deploy-to-prod (including run-evaluations) completes: extract release tag and milestone
# from the merged PR, then create GitHub release. This runs after eval results have been added to main.
# Triggered by workflow_run so the release is created last.
name: Create Release on Merge to Main

on:
  workflow_run:
    workflows: ["Deploy to Prod on Merge to Main"]
    types:
      - completed
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  statuses: write

jobs:
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    # Only run after successful deploy (so evals have run and been pushed); skip chore-only pushes
    if: |
      github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.head_commit == null || !startsWith(github.event.workflow_run.head_commit.message, 'chore: update CHANGELOG for '))
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get merged PR information
        id: pr-info
        uses: actions/github-script@v7
        with:
          script: |
            // When triggered by workflow_run, use the merge commit that triggered the deploy workflow
            const commitSha = context.eventName === 'workflow_run'
              ? context.payload.workflow_run.head_sha
              : context.sha;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // Helper: fetch full PR and return if it's development → main and matches this merge
            async function getPrIfMatch(prNumber) {
              const { data: pr } = await github.rest.pulls.get({
                owner, repo, pull_number: prNumber
              });
              const isBaseMain = pr.base && pr.base.ref === 'main';
              const isHeadDev = pr.head && pr.head.ref === 'development';
              const mergeShaMatches = pr.merge_commit_sha && pr.merge_commit_sha === commitSha;
              if (isBaseMain && isHeadDev && mergeShaMatches) return pr;
              return null;
            }

            // 1) Try commit-associated PRs (works for merge-commit and rebase-merge; NOT for squash)
            const { data: pulls } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner, repo, commit_sha: commitSha
            });
            let mergedPR = pulls.find(pr => pr.base && pr.base.ref === 'main' && pr.head && pr.head.ref === 'development');

            // 2) Fallback: for squash-merge, listPullRequestsAssociatedWithCommit often returns nothing.
            //    Find PR by parsing commit message (e.g. "Title (#123)" or "Merge pull request #123")
            if (!mergedPR) {
              const { data: commit } = await github.rest.repos.getCommit({
                owner, repo, ref: commitSha
              });
              const msg = (commit.commit && commit.commit.message) || '';
              const firstLine = msg.split(/\r?\n/)[0] || '';
              const mergeMatch = msg.match(/Merge pull request #(\d+)/i);
              const squashMatch = firstLine.match(/\(#(\d+)\)\s*$/) || msg.match(/\(#(\d+)\)/);  // prefer end of first line (GitHub squash format)
              const prNum = mergeMatch ? mergeMatch[1] : (squashMatch ? squashMatch[1] : null);
              if (prNum) {
                const pr = await getPrIfMatch(parseInt(prNum, 10));
                if (pr) mergedPR = pr;
              }
            }

            // 3) Fallback: list recently merged PRs into main and match by merge_commit_sha
            if (!mergedPR) {
              const { data: closedPulls } = await github.rest.pulls.list({
                owner, repo, state: 'closed', base: 'main', sort: 'updated', direction: 'desc', per_page: 15
              });
              for (const p of closedPulls) {
                if (p.head && p.head.ref !== 'development') continue;
                const full = await getPrIfMatch(p.number);
                if (full) { mergedPR = full; break; }
              }
            }

            if (!mergedPR) {
              console.log('No PR from development → main found for this commit');
              core.setOutput('found', 'false');
              return;
            }

            const pr = mergedPR.number ? await github.rest.pulls.get({ owner, repo, pull_number: mergedPR.number }).then(r => r.data) : mergedPR;
            // Escape backticks so shell does not interpret them when PR body is used in run script
            const prBody = (pr.body || '').replace(/`/g, '\\`');
            core.setOutput('found', 'true');
            core.setOutput('pr_number', String(pr.number));
            core.setOutput('pr_body', prBody);
            core.setOutput('pr_title', pr.title || '');
            core.setOutput('milestone_title', pr.milestone ? pr.milestone.title : '');
            core.setOutput('milestone_number', pr.milestone ? String(pr.milestone.number) : '');

      - name: Extract release tag from PR body
        id: extract-tag
        if: steps.pr-info.outputs.found == 'true'
        run: |
          PR_BODY="${{ steps.pr-info.outputs.pr_body }}"
          
          # Try multiple patterns to extract release tag
          TAG=$(echo "$PR_BODY" | grep -oP '(?i)Release Tag:\s*`\K[^`]+' || \
                echo "$PR_BODY" | grep -oP '(?i)\*\*Release Tag:\*\*\s*`\K[^`]+' || \
                echo "$PR_BODY" | grep -oP '(?i)Release Tag:\s*\*\*\K[^*]+' || \
                echo "")
          
          # Clean up the tag (remove any extra whitespace)
          TAG=$(echo "$TAG" | xargs)
          
          if [ -z "$TAG" ]; then
            echo "⚠️ No release tag found in PR body"
            echo "tag=" >> $GITHUB_OUTPUT
            echo "found=false" >> $GITHUB_OUTPUT
          else
            echo "tag=$TAG" >> $GITHUB_OUTPUT
            echo "found=true" >> $GITHUB_OUTPUT
            echo "✅ Found release tag: $TAG"
          fi

      - name: Extract milestone from PR
        id: extract-milestone
        if: steps.pr-info.outputs.found == 'true'
        run: |
          MILESTONE_TITLE="${{ steps.pr-info.outputs.milestone_title }}"
          MILESTONE_NUMBER="${{ steps.pr-info.outputs.milestone_number }}"
          
          if [ -n "$MILESTONE_TITLE" ]; then
            echo "title=$MILESTONE_TITLE" >> $GITHUB_OUTPUT
            echo "number=$MILESTONE_NUMBER" >> $GITHUB_OUTPUT
            echo "found=true" >> $GITHUB_OUTPUT
            echo "✅ Found milestone: $MILESTONE_TITLE"
          else
            # Try to extract from PR body as fallback (skip optional ** after colon)
            PR_BODY="${{ steps.pr-info.outputs.pr_body }}"
            MILESTONE=$(echo "$PR_BODY" | grep -oP '(?i)Milestone:\s*\**\s*\K[^\n*]+' | sed 's/\*$//' | xargs || echo "")
            
            if [ -n "$MILESTONE" ]; then
              echo "title=$MILESTONE" >> $GITHUB_OUTPUT
              echo "found=true" >> $GITHUB_OUTPUT
              echo "✅ Found milestone in PR body: $MILESTONE"
            else
              echo "found=false" >> $GITHUB_OUTPUT
              echo "⚠️ No milestone found"
            fi
          fi

      - name: Validate release tag
        if: steps.pr-info.outputs.found == 'true' && steps.extract-tag.outputs.found != 'true'
        run: |
          echo "❌ Error: PR from development → main must include a Release Tag in the PR template"
          echo "Please ensure the PR body contains: **Release Tag:** \`v1.0.0\`"
          exit 1

      - name: Check if tag already exists
        id: check-tag
        if: steps.extract-tag.outputs.found == 'true'
        run: |
          TAG="${{ steps.extract-tag.outputs.tag }}"
          
          # Check if tag already exists
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "⚠️ Tag $TAG already exists"
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Prepare release body
        id: release-body
        if: steps.extract-tag.outputs.found == 'true' && steps.check-tag.outputs.exists != 'true'
        run: |
          TAG="${{ steps.extract-tag.outputs.tag }}"
          PR_NUMBER="${{ steps.pr-info.outputs.pr_number }}"
          PR_TITLE="${{ steps.pr-info.outputs.pr_title }}"
          MILESTONE_TITLE="${{ steps.extract-milestone.outputs.title }}"
          MILESTONE_FOUND="${{ steps.extract-milestone.outputs.found }}"
          
          BODY="## Release ${TAG}"
          BODY="${BODY}"$'\n\n'
          
          if [ "$MILESTONE_FOUND" == "true" ] && [ -n "$MILESTONE_TITLE" ]; then
            BODY="${BODY}**Milestone:** ${MILESTONE_TITLE}"
            BODY="${BODY}"$'\n\n'
          fi
          
          BODY="${BODY}Merged from PR #${PR_NUMBER}: ${PR_TITLE}"
          BODY="${BODY}"$'\n\n'
          BODY="${BODY}---"
          BODY="${BODY}"$'\n\n'
          BODY="${BODY}See the [full changelog](https://github.com/${{ github.repository }}/compare/${TAG}^...${TAG}) for details."
          
          echo "body<<EOF" >> $GITHUB_OUTPUT
          echo "$BODY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Update CHANGELOG with release notes
        if: steps.extract-tag.outputs.found == 'true' && steps.check-tag.outputs.exists != 'true'
        run: |
          TAG="${{ steps.extract-tag.outputs.tag }}"
          PR_NUMBER="${{ steps.pr-info.outputs.pr_number }}"
          PR_TITLE="${{ steps.pr-info.outputs.pr_title }}"
          MILESTONE_TITLE="${{ steps.extract-milestone.outputs.title }}"
          RELEASE_DATE=$(date -u +%Y-%m-%d)
          
          # Build new changelog section (Keep a Changelog style)
          {
            echo "## [${TAG}] - ${RELEASE_DATE}"
            echo "### Summary"
            echo "${PR_TITLE}"
            echo ""
            [ -n "$MILESTONE_TITLE" ] && echo "**Milestone:** ${MILESTONE_TITLE}" && echo ""
            echo "Merged in PR [#${PR_NUMBER}](https://github.com/${{ github.repository }}/pull/${PR_NUMBER})."
            echo ""
          } > CHANGELOG.new
          
          # Insert new section before the first existing version heading
          LINE=$(grep -n '^## \[' CHANGELOG.md | head -1 | cut -d: -f1)
          head -n $((LINE - 1)) CHANGELOG.md > CHANGELOG.md.tmp
          cat CHANGELOG.new >> CHANGELOG.md.tmp
          tail -n +$LINE CHANGELOG.md >> CHANGELOG.md.tmp
          mv CHANGELOG.md.tmp CHANGELOG.md
          rm CHANGELOG.new

      - name: Create PR for CHANGELOG update
        if: steps.extract-tag.outputs.found == 'true' && steps.check-tag.outputs.exists != 'true'
        id: changelog-pr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: bot/release-changelog
          base: main
          add-paths: CHANGELOG.md
          commit-message: |
            chore: update CHANGELOG for ${{ steps.extract-tag.outputs.tag }}
          title: "chore: update CHANGELOG for ${{ steps.extract-tag.outputs.tag }}"
          body: "Automated CHANGELOG update for release ${{ steps.extract-tag.outputs.tag }}."
          labels: auto-generated

      # PRs created by GITHUB_TOKEN do not trigger other workflows; set "Run Tests" success ourselves.
      - name: Set Run Tests status to success
        if: steps.changelog-pr.outputs.pull-request-number != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "/repos/${{ github.repository }}/statuses/${{ steps.changelog-pr.outputs.pull-request-head-sha }}" \
            -f context="Run Tests" \
            -f state="success" \
            -f description="Chore-only PR; no tests required" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Wait for Run Tests status and merge chore PR
        if: steps.changelog-pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHA="${{ steps.changelog-pr.outputs.pull-request-head-sha }}"
          PR_NUM="${{ steps.changelog-pr.outputs.pull-request-number }}"
          echo "Waiting for 'Run Tests' status on $SHA (PR #$PR_NUM)..."
          for i in $(seq 1 24); do
            STATE=$(gh api "/repos/${{ github.repository }}/commits/$SHA/status" -q '.statuses[] | select(.context == "Run Tests") | .state' 2>/dev/null || true)
            if [ "$STATE" = "success" ]; then
              echo "Run Tests passed; merging PR."
              gh pr merge "$PR_NUM" --squash --delete-branch
              exit 0
            fi
            echo "Attempt $i/24: Run Tests state=${STATE:-pending}; waiting 10s..."
            sleep 10
          done
          echo "Timeout waiting for Run Tests; PR left open for manual merge."
          exit 0

      - name: Create GitHub Release
        if: steps.extract-tag.outputs.found == 'true' && steps.check-tag.outputs.exists != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.extract-tag.outputs.tag }}
          name: Release ${{ steps.extract-tag.outputs.tag }}
          target_commitish: main
          generate_release_notes: true
          body: ${{ steps.release-body.outputs.body }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Close milestone
        if: steps.extract-tag.outputs.found == 'true' && steps.check-tag.outputs.exists != 'true' && steps.extract-milestone.outputs.found == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const milestoneNumber = '${{ steps.extract-milestone.outputs.number }}';
            let milestoneTitle = '${{ steps.extract-milestone.outputs.title }}';
            // Normalize: strip leading/trailing markdown bold (**) and whitespace
            milestoneTitle = (milestoneTitle || '').replace(/^\s*\*+\s*|\s*\*+\s*$/g, '').trim();
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            let numberToClose = milestoneNumber ? parseInt(milestoneNumber, 10) : null;
            if (!numberToClose && milestoneTitle) {
              const { data: milestones } = await github.rest.issues.listMilestones({
                owner, repo, state: 'open'
              });
              const match = milestones.find(m => m.title === milestoneTitle);
              if (match) numberToClose = match.number;
            }

            if (numberToClose) {
              await github.rest.issues.updateMilestone({
                owner, repo, milestone_number: numberToClose, state: 'closed'
              });
              console.log('Closed milestone: ' + (milestoneTitle || numberToClose));
            } else {
              console.log('Could not resolve milestone number (title: ' + (milestoneTitle || 'none') + '); skip closing.');
            }

      - name: Skip release (tag already exists)
        if: steps.check-tag.outputs.exists == 'true'
        run: |
          echo "⏭️ Skipping release creation - tag ${{ steps.extract-tag.outputs.tag }} already exists"

      - name: Skip release (no PR found)
        if: steps.pr-info.outputs.found != 'true'
        run: |
          echo "⏭️ Skipping release creation - no PR from development → main found in recent commits"

      - name: Skip release (no tag found)
        if: steps.pr-info.outputs.found == 'true' && steps.extract-tag.outputs.found != 'true'
        run: |
          echo "⏭️ Skipping release creation - no release tag found in PR body"
